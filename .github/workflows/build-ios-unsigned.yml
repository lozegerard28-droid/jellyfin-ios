name: Build iOS unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Ruby 3.1
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true

      - name: CocoaPods install
        run: |
          cd ios
          bundle exec pod install --repo-update

      - name: Xcode archive (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/Jellyfin.xcworkspace \
            -scheme Jellyfin \
            -configuration Release \
            -archivePath output/Jellyfin.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_STYLE=Manual

      - name: Export IPA (unsigned)
        run: |
          xcodebuild -exportArchive \
            -archivePath output/Jellyfin.xcarchive \
            -exportPath output/ \
            -exportOptionsPlist exportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: Jellyfin-ipa
          path: output/Jellyfin.ipa
